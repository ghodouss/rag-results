[project]
name = "sturdy-rag-eval"
version = "0.1.0"
description = "Reproducible Sturdy versus baseline RAG evaluations"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.44",
  "pandas>=2.0",
  "pyarrow>=14",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
